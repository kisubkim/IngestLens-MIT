# 개발 PC에서 실제 모델로 실행할 때의 endpoint (Docker 없음). RAG_MODELS_FILE 이나 eval 스크립트의 --models 로 지정한다.
#   - VLM, 임베딩: PC에 설치한 Ollama (기본 포트 11434). ollama pull qwen2.5vl:7b && ollama pull bge-m3
#   - reranker: deploy/model-server/server.py (CPU로도 동작)
#       python deploy/model-server/server.py --rerank-model BAAI/bge-reranker-v2-m3 --device cpu --port 8090
# Ollama 는 /tokenize 가 없어서 chars_per_token 은 기본값(2.5)으로 폴백한다. 이 폴백은 결정 기록에 남는다.
# 실제 배포 대상은 vLLM 이다(deploy/README.md). 이 구성은 로컬 검증용이다.

embedding:
  base_url: http://localhost:11434/v1
  api_key: ollama
  model: bge-m3
  dim: 1024
  max_tokens: 8192
  batch_size: 16

reranker:
  base_url: http://localhost:8090/v1   # model 은 모델 서버의 --rerank-name(기본: 폴더 이름)과 같아야 한다
  api_key: EMPTY
  model: bge-reranker-v2-m3
  timeout_s: 60

vlm:
  base_url: http://localhost:11434/v1
  api_key: ollama
  model: qwen2.5vl:7b       # GPU 메모리가 적으면 qwen2.5vl:3b
  max_concurrency: 2
  render_dpi: 150
  crop_dpi: 170
  image_format: jpeg
  max_tokens: 2048
  max_tokens_retry: 4096  # an answer cut off at max_tokens is asked again once with this limit (long pages, big tables)
  max_retries: 2
  timeout_s: 300
